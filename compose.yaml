# One-command local stack: `docker compose up --build`, then open http://127.0.0.1:8080.
# Conversations, checkpoints and the document index persist in the citeright_data volume (SQLite).
services:
  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CHECKPOINT_DB_PATH: /app/data/checkpoints/checkpoints.db
      STORE_DB_PATH: /app/data/store/store.db
      LOCAL_RAG_DB_PATH: /app/data/rag/local_rag.db
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      GRAPH_CHROMA_PERSIST_DIR: /app/data/graph_chroma_db
    volumes:
      - citeright_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - path: agent/
          action: sync+restart
          target: /app/agent/
        - path: schema/
          action: sync+restart
          target: /app/schema/
        - path: service/
          action: sync+restart
          target: /app/service/

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      agent_service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  citeright_data:
