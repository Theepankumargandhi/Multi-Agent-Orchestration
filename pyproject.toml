[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "citeright"
version = "0.5.0"
description = "A research assistant that answers from your documents and the web, cites its sources, and refuses to make things up."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "argon2-cffi>=25,<26",
  "cryptography>=50.0.2,<51",
  "fastapi>=0.135,<0.142",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.0,<2",
  "langchain-groq>=1.0,<2",
  "langchain-community>=0.4,<0.5",
  "langchain-chroma>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "pydantic>=2.11,<3",
  "regex>=2024.11.6,<2027",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
citeright-eval = "evals.run_experiments:main"
citeright-grounding-eval = "evals.grounding_evaluation:main"
citeright-evidence-quality-eval = "evals.evidence_quality_evaluation:main"
citeright-memory-eval = "evals.memory_evaluation:main"
citeright-judge-calibration = "evals.run_judge_calibration:main"
citeright-retrieval-eval = "evals.run_retrieval_evals:main"
citeright-review = "evals.review_dataset:main"

[tool.setuptools.packages.find]
include = ["agent*", "client*", "evals*", "schema*", "service*"]

[tool.pytest.ini_options]
testpaths = ["tests", "service", "schema"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: requires external services or model credentials",
  "eval: offline or model-based quality evaluation",
]

[tool.coverage.run]
branch = true
source = ["agent", "client", "schema", "service"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 30

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["conda"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
