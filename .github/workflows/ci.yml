name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI (typecheck, build and offline UI tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck and production build
        working-directory: frontend
        run: |
          npm run format:check
          npm run build
      - name: Test UI and transport with authored responses (no provider)
        working-directory: frontend
        run: npm test

  tests:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --editable .

      - name: Prepare local sqlite directories
        run: mkdir -p data/checkpoints data/store data/rag

      - name: Run unit and integration tests
        env:
          CHECKPOINT_DB_PATH: data/checkpoints/checkpoints_ci.db
          STORE_DB_PATH: data/store/store_ci.db
          LOCAL_RAG_DB_PATH: data/rag/local_rag_ci.db
          ENABLE_USER_AUTH: "true"
          USER_AUTH_SECRET: ci-user-auth-secret
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: Annotate pytest failures
        if: failure() && hashFiles('test-results.xml') != ''
        run: python scripts/ci/report_junit_failures.py test-results.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: test-results.xml
          if-no-files-found: ignore

  ai-evaluations:
    name: Offline AI evaluation gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --editable .

      - name: Prepare local sqlite directories
        run: mkdir -p data/checkpoints data/store data/rag

      - name: Run offline AI evaluation gates
        env:
          CHECKPOINT_DB_PATH: data/checkpoints/checkpoints_ci.db
          STORE_DB_PATH: data/store/store_ci.db
          LOCAL_RAG_DB_PATH: data/rag/local_rag_ci.db
          ENABLE_USER_AUTH: "true"
          USER_AUTH_SECRET: ci-user-auth-secret
        run: |
          python -m evals.run_offline_evals --min-score 0.95
          python -m evals.run_experiments --no-store --min-score 0.95
          python -m evals.build_seed_dataset --check
          python -m evals.grounding_evaluation --output data/evaluations/grounding/ci.json --min-pass-rate 1 --max-unsafe-release-rate 0 --min-receipt-integrity 1
          python -m evals.evidence_quality_evaluation --output data/evaluations/evidence-quality/ci.json --min-pass-rate 1 --min-benign-utility 1 --max-unsafe-release-rate 0
          python -m evals.memory_evaluation --output data/evaluations/memory/ci.json --min-pass-rate 1 --max-cross-tenant-leakage 0 --max-poisoning-asr 0 --max-deletion-violations 0

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation-reports
          path: data/evaluations/
          if-no-files-found: ignore

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: python -m pip install 'ruff>=0.12,<1'

      - name: Lint
        run: python -m ruff check .

  dependency-audit:
    name: Service dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-service.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -f docker/Dockerfile.service -t citeright-service:ci .

      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t citeright-web:ci .
