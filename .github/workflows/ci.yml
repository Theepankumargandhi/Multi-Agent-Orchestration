name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-workbench:
    name: Document Workbench (isolated PDF, OCR and API controls)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
      AF_RUN_DOCUMENT_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test-controller dependencies
        run: python -m pip install 'pydantic>=2.11,<3' 'fastapi>=0.135,<0.142' 'httpx>=0.28,<1' 'pytest>=8.4,<9' 'pytest-asyncio>=1.1,<2' 'Pillow>=12,<13' 'reportlab>=4,<6' 'fonttools>=4.60,<5'
      - name: Build the isolated parser image
        run: docker build -f docker/Dockerfile.document-workbench -t agentforge-document-workbench:local .
      - name: Verify lightweight document imports without the application stack
        run: python -m pytest tests/test_service_imports.py -q
      - name: Verify private API, parsing, OCR, calculations and cleanup (no model)
        run: python -m pytest tests/test_document_workbench.py tests/test_document_workbench_versions.py tests/test_document_workbench_reconciliation.py tests/test_document_claim_audits.py tests/test_document_claim_replay.py tests/test_document_claim_stress.py tests/test_document_claim_bundle.py tests/test_document_source_replay.py tests/test_document_cell_concordance.py tests/test_document_cell_worker.py tests/test_document_pixel_concordance.py tests/test_document_pixel_worker.py tests/test_claim_bundle.py tests/test_evidence_ablation.py tests/test_numeric_claim_audit.py tests/test_bounded_process.py -q

  workbench:
    name: Workbench (typecheck, build and offline UI contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck and production build
        working-directory: frontend
        run: |
          npm run format:check
          npm run build
      - name: Test UI and transport with authored responses (no provider)
        working-directory: frontend
        run: npm test

  tests:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --editable .

      - name: Prepare local sqlite directories
        run: mkdir -p data/checkpoints data/store data/rag

      - name: Provision code parsers before offline runtime tests
        run: python scripts/setup_code_parsers.py

      - name: Build coding sandbox image
        run: docker build -f docker/Dockerfile.code-sandbox -t agentforge-code-sandbox:local .

      - name: Build pinned dependency-migration sandbox
        run: docker build -f docker/Dockerfile.upgradepilot -t agentforge-upgradepilot:local -t agentforge-upgradepilot-schema:local -t agentforge-upgradepilot-sessions:local .

      - name: Run reference-oracle and mutation controls (authored, no provider)
        run: python -m evals.oracle_calibration_evaluation --output data/evaluations/oracle-calibration/ci.json

      - name: Upload oracle-calibration controls
        if: always() && hashFiles('data/evaluations/oracle-calibration/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: oracle-calibration-controls
          path: data/evaluations/oracle-calibration/ci.*
          if-no-files-found: error

      - name: Run unit and integration tests
        # Incident controls never contact a provider or activate a repair.
        env:
          CHECKPOINT_DB_PATH: data/checkpoints/checkpoints_ci.db
          STORE_DB_PATH: data/store/store_ci.db
          LOCAL_RAG_DB_PATH: data/rag/local_rag_ci.db
          ENABLE_USER_AUTH: "true"
          USER_AUTH_SECRET: ci-user-auth-secret
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: Run AI failure-investigation controls (authored, no provider)
        run: |
          python -m evals.incident_investigation_evaluation --output data/evaluations/incident-investigation/ci.json
          python -m evals.runtime_rag_evaluation --output data/evaluations/incident-investigation/runtime-ci.json

      - name: Check UpgradePilot codemod and semantic-repair controls (authored, no provider)
        run: python -m evals.upgradepilot_evaluation --output data/evaluations/upgradepilot/ci.json

      - name: Upload UpgradePilot authored controls
        if: always() && hashFiles('data/evaluations/upgradepilot/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgradepilot-authored-controls
          path: data/evaluations/upgradepilot/ci.json
          if-no-files-found: error

      - name: Check counterexample discovery and overfitting controls (authored, no provider)
        run: python -m evals.upgrade_counterexample_evaluation --output data/evaluations/upgrade-counterexamples/ci.json

      - name: Upload counterexample migration controls
        if: always() && hashFiles('data/evaluations/upgrade-counterexamples/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-counterexample-controls
          path: data/evaluations/upgrade-counterexamples/ci.json
          if-no-files-found: error

      - name: Check schema-guided nested-model ablation (authored, no provider)
        run: python -m evals.upgrade_schema_evaluation --output data/evaluations/upgrade-schema/ci.json

      - name: Upload schema-guided migration controls
        if: always() && hashFiles('data/evaluations/upgrade-schema/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-schema-controls
          path: data/evaluations/upgrade-schema/ci.json
          if-no-files-found: error

      - name: Check stateful traces and withheld-session overfitting controls (authored, no provider)
        run: python -m evals.upgrade_session_evaluation --output data/evaluations/upgrade-sessions/ci.json

      - name: Upload stateful migration controls
        if: always() && hashFiles('data/evaluations/upgrade-sessions/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-session-controls
          path: data/evaluations/upgrade-sessions/ci.json
          if-no-files-found: error

      - name: Upload AI failure-investigation controls
        if: always() && hashFiles('data/evaluations/incident-investigation/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: incident-investigation-controls
          path: data/evaluations/incident-investigation/*.json
          if-no-files-found: error

      - name: Annotate pytest failures
        if: failure() && hashFiles('test-results.xml') != ''
        run: python scripts/ci/report_junit_failures.py test-results.xml

      - name: Verify retrieval artifact reproducibility
        run: python -m code_agent.retrieval_learning train-fusion evals/datasets/code_context_learning.jsonl --repository-root . --negatives-per-positive 4 --epochs 400 --check evals/experiments/code_context_fusion.json

      - name: Check execution-guided localization controls (authored, no provider)
        run: |
          python -m evals.execution_retrieval_evaluation --output data/evaluations/execution-retrieval/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/execution_retrieval_matrix.json

      - name: Check reviewed repair-memory controls (authored, no provider)
        run: python -m evals.repair_memory_evaluation --output data/evaluations/repair-memory/ci.json

      - name: Check frozen-memory leak controls (authored, no provider)
        run: python -m evals.memory_snapshot_evaluation --output data/evaluations/memory-snapshot/ci.json

      - name: Check counterfactual regression controls (authored, no provider)
        run: |
          python -m evals.counterfactual_evaluation --output data/evaluations/counterfactual/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/counterfactual_matrix.json

      - name: Check spectrum fault-localization controls (authored, no provider)
        run: |
          python -m evals.fault_localization_evaluation --output data/evaluations/fault-localization/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/fault_localization_matrix.json

      - name: Check file-level patch minimization controls (authored, no provider)
        run: |
          python -m evals.patch_minimization_evaluation --output data/evaluations/patch-minimization/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/patch_minimization_matrix.json

      - name: Compare agent cycle controls (scripted, no provider or host execution)
        run: |
          python -m evals.loop_guard_evaluation --output data/evaluations/loop-guard/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/loop_guard_matrix.json

      - name: Check patch mutation sensitivity controls (authored, no provider)
        run: |
          python -m evals.patch_mutation_evaluation --output data/evaluations/patch-mutation/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/patch_mutation_matrix.json

      - name: Upload patch mutation sensitivity controls
        if: always() && hashFiles('data/evaluations/patch-mutation/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: patch-mutation-sensitivity-controls
          path: data/evaluations/patch-mutation/ci.json
          if-no-files-found: error

      - name: Upload agent cycle controls
        if: always() && hashFiles('data/evaluations/loop-guard/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-cycle-controls
          path: data/evaluations/loop-guard/ci.json
          if-no-files-found: error

      - name: Upload file-level patch minimization controls
        if: always() && hashFiles('data/evaluations/patch-minimization/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: file-level-patch-minimization-controls
          path: data/evaluations/patch-minimization/ci.json
          if-no-files-found: error

      - name: Upload spectrum fault-localization controls
        if: always() && hashFiles('data/evaluations/fault-localization/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-fault-localization-controls
          path: data/evaluations/fault-localization/ci.json
          if-no-files-found: error

      - name: Upload counterfactual regression controls
        if: always() && hashFiles('data/evaluations/counterfactual/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-regression-controls
          path: data/evaluations/counterfactual/ci.json
          if-no-files-found: error

      - name: Upload frozen-memory leak controls
        if: always() && hashFiles('data/evaluations/memory-snapshot/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frozen-memory-leak-controls
          path: data/evaluations/memory-snapshot/ci.json
          if-no-files-found: error

      - name: Upload reviewed repair-memory controls
        if: always() && hashFiles('data/evaluations/repair-memory/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-repair-memory-controls
          path: data/evaluations/repair-memory/ci.json
          if-no-files-found: error

      - name: Upload execution-guided localization controls
        if: always() && hashFiles('data/evaluations/execution-retrieval/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: execution-guided-localization-controls
          path: data/evaluations/execution-retrieval/ci.json
          if-no-files-found: error

      - name: Report experimental retrieval candidate (no activation)
        run: |
          python -m code_agent.retrieval_learning validate-fusion evals/datasets/code_context_smoke.jsonl --repository-root . --artifact evals/experiments/code_context_fusion.json --top-k 8 --max-tokens 4096 --output data/evaluations/code-context/fusion-ci.json
          python scripts/ci/report_retrieval_candidate.py data/evaluations/code-context/fusion-ci.json --artifact evals/experiments/code_context_fusion.json

      - name: Upload experimental retrieval decision
        if: always() && hashFiles('data/evaluations/code-context/fusion-ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: experimental-retrieval-decision
          path: data/evaluations/code-context/fusion-ci.json
          if-no-files-found: error

      - name: Run evidence-span retrieval stress benchmark (no activation)
        run: python -m evals.retrieval_span_evaluation --plan evals/experiments/retrieval_span_plan.json --output data/evaluations/retrieval-spans/ci.json

      - name: Upload evidence-span comparison
        if: always() && hashFiles('data/evaluations/retrieval-spans/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-span-retrieval-comparison
          path: data/evaluations/retrieval-spans/ci.*
          if-no-files-found: error

      - name: Compare opt-in context packing (no activation)
        run: python -m evals.retrieval_span_evaluation --plan evals/experiments/context_packing_plan.json --output data/evaluations/context-packing/ci.json

      - name: Upload context-packing comparison
        if: always() && hashFiles('data/evaluations/context-packing/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: context-packing-comparison
          path: data/evaluations/context-packing/ci.*
          if-no-files-found: error

      - name: Compare retrieval query robustness (no activation)
        run: python -m evals.retrieval_robustness --output data/evaluations/retrieval-robustness/ci.json

      - name: Upload retrieval robustness comparison
        if: always() && hashFiles('data/evaluations/retrieval-robustness/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-robustness-comparison
          path: data/evaluations/retrieval-robustness/ci.*
          if-no-files-found: error

      - name: Run repair-tournament orchestration controls (no provider or activation)
        run: python -m evals.repair_tournament_evaluation --output data/evaluations/repair-tournament/ci.json

      - name: Run adaptive-supervisor controls (authored, no provider or activation)
        run: python -m evals.adaptive_supervisor_evaluation --output data/evaluations/adaptive-supervisor/ci.json

      - name: Upload adaptive-supervisor controls
        if: always() && hashFiles('data/evaluations/adaptive-supervisor/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-supervisor-controls
          path: data/evaluations/adaptive-supervisor/ci.*
          if-no-files-found: error

      - name: Run reviewed dispatch learning controls (synthetic, no provider or activation)
        run: python -m evals.dispatch_learning_evaluation --output-dir data/evaluations/dispatch-learning/ci

      - name: Upload reviewed dispatch learning controls
        if: always() && hashFiles('data/evaluations/dispatch-learning/ci/controls.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dispatch-learning-controls
          path: data/evaluations/dispatch-learning/ci/
          if-no-files-found: error

      - name: Run dispatch supervision controls (authored, no provider or activation)
        run: python -m evals.dispatch_supervision_evaluation --output-dir data/evaluations/dispatch-supervision/ci

      - name: Upload dispatch supervision controls
        if: always() && hashFiles('data/evaluations/dispatch-supervision/ci/controls.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-supervision-controls
          path: data/evaluations/dispatch-supervision/ci/
          if-no-files-found: error

      - name: Upload repair-tournament controls
        if: always() && hashFiles('data/evaluations/repair-tournament/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: repair-tournament-controls
          path: data/evaluations/repair-tournament/ci.*
          if-no-files-found: error

      - name: Run sandboxed regression-probe ablation (authored controls, no provider)
        run: python -m evals.regression_challenge_evaluation --output data/evaluations/regression-challenges/ci.json

      - name: Upload regression-probe ablation
        if: always() && hashFiles('data/evaluations/regression-challenges/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: regression-challenge-controls
          path: data/evaluations/regression-challenges/ci.*
          if-no-files-found: error

      - name: Run offline AI evaluation gates
        env:
          CHECKPOINT_DB_PATH: data/checkpoints/checkpoints_ci.db
          STORE_DB_PATH: data/store/store_ci.db
          LOCAL_RAG_DB_PATH: data/rag/local_rag_ci.db
          ENABLE_USER_AUTH: "true"
          USER_AUTH_SECRET: ci-user-auth-secret
        run: |
          python -m evals.run_offline_evals --min-score 0.95
          python -m evals.run_experiments --no-store --min-score 0.95
          python -m evals.build_seed_dataset --check
          python -m code_agent.evaluation evals/datasets/code_agent_smoke.jsonl --validate-only
          python -m code_agent.context_evaluation --repository-root . --top-k 8 --min-recall 0.90
          python -m code_agent.context_evaluation --repository-root . --top-k 8 --ablation --token-budgets 256,512,1024,2048 --output data/evaluations/code-context/ci.json
          python -m code_agent.security_evaluation --max-asr 0.05 --min-benign-pass-rate 0.95 --output data/evaluations/security/ci.json
          python -m code_agent.benchmark_release validate evals/experiments/code_agent_release_matrix.json
          python -m code_agent.observability evals/datasets/genai_telemetry_smoke.jsonl --output data/evaluations/telemetry/ci.json
          python -m evals.reliability --output data/evaluations/reliability/ci.json --min-pass-rate 1 --min-recovery-rate 1 --max-p95-ms 250
          python -m evals.arena evals/experiments/agent_arena.json --output data/evaluations/arena/ci.json --require-promotion
          python -m evals.model_gateway_evaluation --output data/evaluations/model-gateway/ci.json --min-pass-rate 1 --max-privacy-violations 0 --max-canary-deviation 2.5
          python -m evals.online_monitor_evaluation --output data/evaluations/online-monitor/ci.json --require-decision rollback --min-integrity-rate 1 --max-privacy-violations 0 --require-alert
          python -m evals.memory_evaluation --output data/evaluations/memory/ci.json --min-pass-rate 1 --max-cross-tenant-leakage 0 --max-poisoning-asr 0 --max-deletion-violations 0
          python -m evals.grounding_evaluation --output data/evaluations/grounding/ci.json --min-pass-rate 1 --max-unsafe-release-rate 0 --min-receipt-integrity 1
          python -m evals.uncertainty_evaluation --output data/evaluations/uncertainty/ci.json --artifact data/evaluations/uncertainty/calibrator.json --target-error-rate 0.2 --min-selective-accuracy 1 --max-empirical-error 0 --min-incorrect-abstention 1 --require-drift-detection
          python -m evals.adaptive_compute_evaluation --output data/evaluations/adaptive-compute/ci.json --min-pass-rate 1 --min-recovery-rate 1 --max-unsafe-release-rate 0 --max-budget-violation-rate 0
          python -m evals.evidence_quality_evaluation --output data/evaluations/evidence-quality/ci.json --min-pass-rate 1 --min-benign-utility 1 --max-unsafe-release-rate 0
          python -m evals.contextual_bandit evals/datasets/contextual_bandit_feedback.jsonl --artifact data/evaluations/bandit/policy.json --report data/evaluations/bandit/report.json --check evals/experiments/contextual_bandit_policy.json --require-promotion
          python -m evals.process_reward_evaluation evals/datasets/process_reward_trajectories.jsonl --artifact data/evaluations/process-reward/model.json --output data/evaluations/process-reward/report.json --check evals/experiments/process_reward_model.json --require-promotion
          python -m evals.search_planning_evaluation --process-reward-artifact evals/experiments/process_reward_model.json --output data/evaluations/search-planning/ci.json --check evals/experiments/search_planning.report.json --require-promotion
          python -m evals.verifier_uncertainty_evaluation --artifact data/evaluations/verifier-uncertainty/ensemble.json --output data/evaluations/verifier-uncertainty/report.json --check-artifact evals/experiments/process_reward_ensemble.json --check-report evals/experiments/verifier_uncertainty.report.json --require-promotion
          python -m evals.world_model_evaluation --artifact data/evaluations/world-model/world-model.json --output data/evaluations/world-model/report.json --require-promotion
          python -m evals.offline_rl_evaluation --artifact data/evaluations/offline-rl/offline-rl-policy.json --output data/evaluations/offline-rl/report.json --require-promotion
          python -m evals.distillation_evaluation --require-promotion
          python -m evals.replay_calibration --drill --require-gate
          python -m evals.prospective_evaluation drill --require-gate
          python -m evals.preference_evaluation drill --require-gate
          python -m evals.preference_shadow_evaluation drill --require-gate
          python -m evals.preference_deployment_evaluation drill --require-gate
          python -m evals.process_supervision_evaluation drill --require-gate
          python -m evals.verifier_shadow_evaluation drill --require-gate
          python -m evals.reviewed_verifier_uncertainty_evaluation drill --require-gate
          python -m evals.ensemble_outcome_evaluation drill --require-gate
          python -m evals.flywheel --help
          python -m post_training.cli smoke --output-dir data/evaluations/post-training/ci-smoke
          python -m post_training.cli register --registry data/evaluations/post-training/registry.json --version ci-smoke-v1 --run-manifest data/evaluations/post-training/ci-smoke/run_manifest.json

      - name: Lint
        run: python -m ruff check .

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-service.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: test-results.xml
          if-no-files-found: ignore

      - name: Upload code-context ablation
        uses: actions/upload-artifact@v4
        with:
          name: code-context-ablation
          path: data/evaluations/code-context/ci.json
          if-no-files-found: error

      - name: Upload agent security report
        uses: actions/upload-artifact@v4
        with:
          name: agent-security-red-team
          path: data/evaluations/security/ci.json
          if-no-files-found: error

      - name: Upload GenAI telemetry gate
        uses: actions/upload-artifact@v4
        with:
          name: genai-telemetry-gate
          path: data/evaluations/telemetry/ci.json
          if-no-files-found: error

      - name: Upload agent reliability report
        uses: actions/upload-artifact@v4
        with:
          name: agent-reliability-report
          path: data/evaluations/reliability/ci.json
          if-no-files-found: error

      - name: Upload behavioral arena report
        uses: actions/upload-artifact@v4
        with:
          name: agent-behavioral-arena
          path: data/evaluations/arena/ci.json
          if-no-files-found: error

      - name: Upload inference gateway report
        uses: actions/upload-artifact@v4
        with:
          name: inference-gateway-control-plane
          path: data/evaluations/model-gateway/ci.json
          if-no-files-found: error

      - name: Upload online AI governance report
        uses: actions/upload-artifact@v4
        with:
          name: online-ai-canary-governance
          path: data/evaluations/online-monitor/ci.json
          if-no-files-found: error

      - name: Upload trustworthy agent memory report
        uses: actions/upload-artifact@v4
        with:
          name: trustworthy-agent-memory
          path: data/evaluations/memory/ci.json
          if-no-files-found: error

      - name: Upload claim-grounding report
        uses: actions/upload-artifact@v4
        with:
          name: claim-grounding-verification
          path: data/evaluations/grounding/ci.json
          if-no-files-found: error

      - name: Upload uncertainty calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: conformal-selective-generation
          path: data/evaluations/uncertainty/
          if-no-files-found: error

      - name: Upload adaptive compute evidence
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-test-time-compute
          path: data/evaluations/adaptive-compute/
          if-no-files-found: error

