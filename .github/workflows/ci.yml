  metamorphic-migration-controls:
    name: Metamorphic Migration Controls (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --editable .

      - name: Build pinned migration and session sandbox
        run: docker build -f docker/Dockerfile.upgradepilot -t agentforge-upgradepilot:local -t agentforge-upgradepilot-sessions:local .

      - name: Verify migration sandbox aliases
        run: |
          python -c "from code_agent.upgrade_runner import resolve_image; migration = resolve_image('agentforge-upgradepilot:local'); sessions = resolve_image('agentforge-upgradepilot-sessions:local'); assert migration == sessions, 'migration sandbox aliases differ'; print(migration)"

      - name: Check generated laws, overfitting and invalid-source-oracle controls
        run: python -m evals.upgrade_relation_evaluation --output data/evaluations/upgrade-relations/ci.json

      - name: Upload metamorphic workflow controls
        if: always() && hashFiles('data/evaluations/upgrade-relations/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-relation-controls
          path: data/evaluations/upgrade-relations/ci.json
          if-no-files-found: error

      - name: Check crash-safe study recovery (offline scripted specialists)
        run: python -m evals.upgrade_recovery_evaluation --control-root data/upgradepilot/recovery-ci --output data/evaluations/upgrade-recovery/ci.json

      - name: Upload migration recovery controls
        if: always() && hashFiles('data/evaluations/upgrade-recovery/ci.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-recovery-controls
          path: data/evaluations/upgrade-recovery/ci.json
          if-no-files-found: error

  document-sdk:
    name: Document SDK (verified reasoning and evidence workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install only SDK and integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install './sdk[pdf,fastapi,multimodal]' pytest pytest-asyncio httpx reportlab
          tesseract --version

      - name: Run standalone SDK and HTTP example tests
        # Production-service parity runs in the full-platform job, not this SDK-only environment.
        run: python -m pytest tests/test_document_sdk.py tests/test_document_sdk_retrieval.py tests/test_document_sdk_integration.py tests/test_multimodal_sdk.py tests/test_evidence_review.py tests/test_document_changes.py tests/test_document_revalidation.py tests/test_evidence_reconciliation.py tests/test_document_reasoning.py tests/test_groq_reasoning.py tests/test_financebench_pilot.py -k 'not shared_production' -q

      - name: Run authored text-evidence controls
        run: python -m evals.document_sdk_evaluation --output data/evaluations/document-sdk/ci-controls.json

      - name: Run actual local OCR and spatial/cell evidence controls (authored documents)
        run: python -m evals.multimodal_evaluation --output-dir data/evaluations/document-sdk/multimodal

      - name: Run source-bound correction and revocable review controls (authored approvals)
        run: python -m evals.evidence_review_evaluation --output-dir data/evaluations/document-sdk/review

      - name: Compare authored PDF revisions and replay affected calculations
        run: python -m evals.document_change_evaluation --output-dir data/evaluations/document-sdk/changes

      - name: Revalidate saved answers and calculations in bounded resumable batches
        run: python -m evals.document_revalidation_evaluation --output-dir data/evaluations/document-sdk/revalidation

      - name: Reconcile cross-document numeric evidence and hold conflicting calculations
        run: python -m evals.evidence_reconciliation_evaluation --output-dir data/evaluations/document-sdk/reconciliation

      - name: Verify bounded reasoning with authored plans and actual PDFs (no model calls)
        run: python -m evals.document_reasoning_evaluation --output-dir data/evaluations/document-sdk/reasoning

      - name: Verify installed wheel outside the checkout
        run: python -m evals.document_sdk_packaging --output-dir data/evaluations/document-sdk/ci-package --multimodal-fixtures data/evaluations/document-sdk/multimodal/fixtures --review-evidence data/evaluations/document-sdk/review --change-evidence data/evaluations/document-sdk/changes

  portable-patch-controls:
    name: Portable Patch and Pilot Controls (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --editable .

      - name: Build offline execution images
        run: |
          docker build -f docker/Dockerfile.code-sandbox -t agentforge-code-sandbox:local .
          docker build -f docker/Dockerfile.upgradepilot -t agentforge-upgradepilot:local .

      - name: Test patch admission, review provenance and pilot lifecycle
        run: python -m pytest tests/test_patch_verify.py tests/test_patch_verify_docker.py tests/test_regression_benchmark.py tests/test_maintainer_pilot.py -q

      - name: Test structured domains, reviewed AI proposals and output bounds
        run: python -m pytest tests/test_patch_json.py tests/test_patch_contracts.py tests/test_patch_replay.py tests/test_bounded_process.py tests/test_structured_patch_evaluation.py tests/test_structured_patch_docker.py -q

      - name: Test upstream provenance and bounded existing-test selectors (offline)
        run: python -m pytest tests/test_upstream_git.py tests/test_upstream_pilot.py tests/test_patch_selectors.py -q

      - name: Discover and reduce hidden regressions (authored, no provider)
        run: python -m evals.structured_patch_evaluation --output-dir data/patch-verify/ci-structured-controls

      - name: Compare all authored patch controls (no provider calls)
        run: python -m evals.patch_verification_evaluation --output-dir data/regression-benchmark/ci-controls

      - name: Exercise consented pilot lifecycle (synthetic consent and review)
        run: python -m evals.maintainer_pilot_evaluation --output-dir data/maintainer-pilots/ci-controls

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -f docker/Dockerfile.service -t multi-agent-orchestration-service:ci .

      - name: Build app image
        run: docker build -f docker/Dockerfile.app -t multi-agent-orchestration-app:ci .

      - name: Build coding evaluation dashboard image
        run: docker build -f docker/Dockerfile.eval-dashboard -t agentforge-code-eval-dashboard:ci .

      - name: Build code-context dashboard image
        run: docker build -f docker/Dockerfile.context-dashboard -t agentforge-code-context-dashboard:ci .

      - name: Build post-training dashboard image
        run: docker build -f docker/Dockerfile.post-training-dashboard -t agentforge-post-training-dashboard:ci .

      - name: Build agent security dashboard image
        run: docker build -f docker/Dockerfile.security-dashboard -t agentforge-security-dashboard:ci .

      - name: Build reliability command center image
        run: docker build -f docker/Dockerfile.reliability-dashboard -t agentforge-reliability-dashboard:ci .
