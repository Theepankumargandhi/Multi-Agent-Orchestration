apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-service-ingress
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: agent-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: streamlit-app
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000
