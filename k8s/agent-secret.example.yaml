apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: agent-platform
type: Opaque
stringData:
  # Required for auth token signing.
  USER_AUTH_SECRET: "replace-with-long-random-secret"

  # Add at least one model provider key for LLM responses.
  OPENAI_API_KEY: ""
  GROQ_API_KEY: ""
  # Required only when MODEL_GATEWAY_ENABLED=true.
  MODEL_GATEWAY_FINGERPRINT_KEY: "replace-with-a-dedicated-random-secret"
  # Required when MODEL_GATEWAY_ONLINE_EVENT_PATH is configured.
  ONLINE_EVAL_INTEGRITY_KEY: "replace-with-a-separate-random-secret"
  # Required only when AGENT_MEMORY_ENABLED=true.
  AGENT_MEMORY_INTEGRITY_KEY: "replace-with-a-dedicated-random-secret"
  # Optional keyed grounding-receipt integrity.
  GROUNDING_INTEGRITY_KEY: "replace-with-a-separate-random-secret"
  UNCERTAINTY_INTEGRITY_KEY: "replace-with-another-random-secret"
  ADAPTIVE_COMPUTE_INTEGRITY_KEY: "replace-with-an-independent-random-secret"
  EVIDENCE_QUALITY_INTEGRITY_KEY: "replace-with-another-independent-random-secret"

  # Optional.
  LANGSMITH_API_KEY: ""
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "replace-with-a-strong-password"
